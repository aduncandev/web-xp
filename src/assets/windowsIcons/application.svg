<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- XP-style generic application (default .exe) icon -->
  <defs>
    <linearGradient id="appTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A62D8"/>
      <stop offset="0.5" stop-color="#0B44BF"/>
      <stop offset="1" stop-color="#0A3AA6"/>
    </linearGradient>
    <linearGradient id="appBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4F1"/>
    </linearGradient>
  </defs>
  <!-- drop shadow -->
  <rect x="4" y="6" width="26" height="22" rx="1.5" fill="#000" opacity="0.25"/>
  <!-- window frame -->
  <rect x="2.5" y="4.5" width="26" height="22" rx="1.5" fill="url(#appBody)" stroke="#3B5B8F" stroke-width="1"/>
  <!-- title bar -->
  <rect x="3" y="5" width="25" height="5.5" rx="1" fill="url(#appTitle)"/>
  <!-- title bar buttons -->
  <rect x="24.5" y="6.3" width="2.4" height="2.4" fill="#E8B04A" stroke="#7A4A10" stroke-width="0.5"/>
  <!-- form content lines -->
  <rect x="6" y="13" width="14" height="1.6" fill="#9DB0CC"/>
  <rect x="6" y="16.5" width="18" height="1.6" fill="#B8C6DC"/>
  <rect x="6" y="20" width="10" height="1.6" fill="#B8C6DC"/>
  <!-- OK button -->
  <rect x="18" y="20.5" width="8" height="3.6" rx="0.8" fill="#ECE9D8" stroke="#7F9DB9" stroke-width="0.7"/>
</svg>
